services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: portal-sugestao-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_dev_only_123!"
    ports:
      - "1433:1433"
    volumes:
      - portal-sugestao-sqldata:/var/opt/mssql

  mailhog:
    image: mailhog/mailhog:latest
    container_name: portal-sugestao-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI web (http://localhost:8025)

volumes:
  portal-sugestao-sqldata:
