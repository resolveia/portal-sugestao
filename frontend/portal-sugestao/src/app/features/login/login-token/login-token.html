<div class="login-token-page">
  <div class="card login-token-card">
    <div class="brand">
      <h1>Portal de Sugestões</h1>
    </div>

    @if (erro()) {
      <p class="erro">{{ erro() }}</p>
      <dx-button text="Ir para o login manual" width="100%" (onClick)="voltarParaLoginManual()"></dx-button>
    } @else {
      <p class="aviso">Validando seu acesso vindo do ERP, aguarde…</p>
    }
  </div>
</div>
