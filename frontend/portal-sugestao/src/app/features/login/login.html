<div class="login-page">
  <div class="card login-card">
    <div class="brand">
      <h1>Portal de Sugestões</h1>
      <p class="subtitulo">Sugira, vote e acompanhe as melhorias do ERP</p>
    </div>

    <p class="aviso">
      Login simulado (mock) — o SSO real com o ERP ainda depende de definição técnica (ver PRD).
    </p>

    <div class="campo">
      <label>E-mail</label>
      <dx-text-box [(value)]="email" placeholder="cliente@empresa.com"></dx-text-box>
    </div>

    <div class="campo">
      <label>Nome</label>
      <dx-text-box [(value)]="nome" placeholder="Seu nome"></dx-text-box>
    </div>

    <div class="campo">
      <label>Empresa</label>
      <dx-text-box [(value)]="empresa" placeholder="Nome da empresa"></dx-text-box>
    </div>

    <div class="campo">
      <label>Perfil</label>
      <dx-select-box [(value)]="role" [items]="roles"></dx-select-box>
    </div>

    @if (erro()) {
      <p class="erro">{{ erro() }}</p>
    }

    <dx-button
      class="botao-entrar"
      text="Entrar"
      type="default"
      width="100%"
      [disabled]="carregando()"
      (onClick)="entrar()"
    ></dx-button>

    <div class="divisor">ou simule a entrada automática vinda do ERP</div>

    <div class="botoes-simulacao">
      <dx-button
        text="Entrar como Admin (via ERP)"
        width="100%"
        [disabled]="simulando()"
        (onClick)="simularEntradaViaErp('admin')"
      ></dx-button>
      <dx-button
        text="Entrar como Cliente (via ERP)"
        width="100%"
        [disabled]="simulando()"
        (onClick)="simularEntradaViaErp('cliente')"
      ></dx-button>
    </div>
  </div>
</div>
