<div class="login-page">
  <div class="card login-card">
    <div class="brand">
      <h1>Portal de Sugestões</h1>
      <p class="subtitulo">Sugira, vote e acompanhe as melhorias do ERP</p>
    </div>

    <div class="campo">
      <label>ID</label>
      <dx-text-box [(value)]="empresaId" placeholder="Identificador da empresa"></dx-text-box>
    </div>

    <div class="campo">
      <label>Login</label>
      <dx-text-box [(value)]="login" placeholder="Seu login"></dx-text-box>
    </div>

    <div class="campo">
      <label>Senha</label>
      <dx-text-box [(value)]="senha" mode="password" placeholder="Sua senha"></dx-text-box>
    </div>

    @if (erro()) {
      <p class="erro">{{ erro() }}</p>
    }

    <dx-button
      class="botao-entrar"
      text="Entrar"
      type="default"
      width="100%"
      [disabled]="carregando()"
      (onClick)="entrar()"
    ></dx-button>
  </div>
</div>
