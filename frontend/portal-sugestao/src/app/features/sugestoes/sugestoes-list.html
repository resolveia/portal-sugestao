<div class="sugestoes-page">
  <div class="page-title">
    <h1>Ranking de Sugestões</h1>
    @if (authService.usuario()?.role === 'Cliente') {
      <span class="votos-disponiveis">Você tem <strong>{{ votosDisponiveis() }}</strong> de {{ limiteVotos }} votos disponíveis</span>
    }
    <dx-button class="btn-nova-sugestao" text="Nova sugestão" type="default" icon="plus" (onClick)="mostrarNovaSugestao.set(true)"></dx-button>
  </div>

  @if (erro()) {
    <p class="erro">{{ erro() }}</p>
  }

  <section class="card">
    <dx-data-grid
      [dataSource]="sugestoesDataSource"
      [showBorders]="true"
      [columnAutoWidth]="true"
      [remoteOperations]="{ paging: true }"
      [paging]="{ pageSize: 20 }"
      [pager]="{ visible: true, showPageSizeSelector: true, allowedPageSizes: [10, 20, 50], showInfo: true }"
      [masterDetail]="{ enabled: true, template: 'comentariosTemplate' }"
    >
      <dxi-column dataField="produtoNome" caption="Produto"></dxi-column>
      <dxi-column dataField="titulo" caption="Título"></dxi-column>
      <dxi-column dataField="categoriaNome" caption="Categoria"></dxi-column>
      <dxi-column dataField="autorNome" caption="Autor"></dxi-column>
      <dxi-column dataField="totalVotos" caption="Votos" [width]="90"></dxi-column>
      <dxi-column dataField="dataCriacao" caption="Criada em" dataType="date" [format]="'dd/MM/yyyy'"></dxi-column>
      @if (authService.usuario()?.role === 'Cliente') {
        <dxi-column caption="Ação" cellTemplate="votoTemplate" [width]="160"></dxi-column>
      }

      <div *dxTemplate="let row of 'votoTemplate'">
        @if (row.data.votadoPorMim) {
          <dx-button text="Remover voto" type="danger" (onClick)="removerVoto(row.data.id)"></dx-button>
        } @else {
          <dx-button
            text="Votar"
            type="default"
            [disabled]="votosDisponiveis() === 0"
            (onClick)="votar(row.data.id)"
          ></dx-button>
        }
      </div>

      <div *dxTemplate="let info of 'comentariosTemplate'">
        <app-comentarios [sugestaoId]="info.data.id"></app-comentarios>
      </div>
    </dx-data-grid>
  </section>

  <dx-popup
    [(visible)]="mostrarNovaSugestao"
    title="Nova sugestão"
    [width]="480"
    height="auto"
    [showCloseButton]="true"
    [dragEnabled]="false"
    [hideOnOutsideClick]="true"
  >
    <div class="nova-sugestao">
      <div class="campo">
        <label>Produto *</label>
        <dx-select-box
          [items]="produtos()"
          displayExpr="nome"
          valueExpr="id"
          [(value)]="novoProdutoId"
        ></dx-select-box>
      </div>
      <div class="campo">
        <label>Título *</label>
        <dx-text-box [(value)]="novoTitulo"></dx-text-box>
      </div>
      <div class="campo">
        <label>Descrição *</label>
        <dx-text-box [(value)]="novaDescricao"></dx-text-box>
      </div>
      <div class="campo">
        <label>Resultado esperado com essa solicitação *</label>
        <dx-text-box [(value)]="novoResultadoEsperado"></dx-text-box>
      </div>
      <div class="campo">
        <label>Categoria *</label>
        <dx-select-box
          [items]="categorias()"
          displayExpr="nome"
          valueExpr="id"
          [(value)]="novaCategoriaId"
        ></dx-select-box>
      </div>
      <dx-button text="Enviar sugestão" type="default" (onClick)="criarSugestao()"></dx-button>
    </div>
  </dx-popup>
</div>
