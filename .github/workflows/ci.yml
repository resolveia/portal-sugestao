name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore

      - name: Test
        working-directory: backend
        run: dotnet test --no-build --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/portal-sugestao/package-lock.json

      - name: Install dependencies
        working-directory: frontend/portal-sugestao
        run: npm ci

      - name: Test
        working-directory: frontend/portal-sugestao
        run: npm test -- --watch=false

      - name: Build
        working-directory: frontend/portal-sugestao
        run: npm run build
